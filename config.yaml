# --- アカウント設定 ---
account_name: "うみ"
handle: "@uuumi345"
timezone: "Asia/Tokyo"

# 投稿スロット（アルゴリズム上、初動の反応が取りやすい朝・昼・夜）
# 種別: M=短い気づき / N=コピペ用プロンプト(画像付き) / E=問いかけ(返信誘導) / S=保存版まとめ(画像付き)
slots:
  - { time: "07:30", kind: "M" }
  - { time: "12:15", kind: "N" }
  - { time: "19:00", kind: "E" }
  - { time: "21:45", kind: "S" }

# --- 投稿の見せ方 ---
schedule:
  jitter_minutes: 7     # 予約時刻を±7分ずらす(毎日ぴったり同じ分だと機械的に見えるため)

# 自分への続きリプ(スレッド)。会話・滞在時間のシグナルを作る。followupがある投稿だけ対象。
# Buffer側で拒否された場合は単発投稿に自動で切り替わる
thread:
  enabled: true
  kinds: [N, E, S]

# --- Buffer ---
# 無料プランは予約枠に上限があるため、Buffer側に同時に積む件数を制限する
max_scheduled_in_buffer: 10
# 画像の公開URLのベース（GitHubの公開リポジトリのrawを想定）
# 例: https://raw.githubusercontent.com/<ユーザー名>/<リポジトリ名>/main/images
image_base_url: "https://raw.githubusercontent.com/jnkgy801-eng/X-dmm-videoa-buffer-umi/main/images"

# --- 自動生成（任意。ANTHROPIC_API_KEY が必要） ---
generate:
  model: "claude-sonnet-5-5"
  min_pending: 8        # 未予約の投稿がこれを下回ったら補充
  batch_days: 7         # 補充時に何日分作るか
  theme: "生成AIを使った仕事・勉強・日常の時短術（コピペで使えるプロンプト付き）"
  # ↓ここを自分の言葉で埋めるほど「AI量産感」が消えて保存・返信されやすくなる
  persona: "AIで仕事の時短をしている会社員。難しい言葉を使わず、すぐ試せる形で教える"
  experiences: []       # 例: ["議事録の要約をAIに任せて週1時間浮いた", "最初は指示が曖昧で使えない出力ばかりだった"]
  similarity_threshold: 0.8   # 既存投稿とこれ以上似ていたら再生成
  banned_phrases: ["絶対", "誰でも", "必ず稼", "月収", "爆速", "完全版"]

# analyze(反応データ分析)の重み。X内部の重みではなく運用上の目安。好みで調整
analyze:
  weights: { likes: 1, reposts: 3, replies: 8, bookmarks: 5, profile: 4, follows: 10 }
