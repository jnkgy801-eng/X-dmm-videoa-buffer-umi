name: FANZA同人 → はてなブログ 下書き生成

on:
  workflow_dispatch:
    inputs:
      post_start_index:
        description: '取得開始番号（空欄でランダム自動設定）'
        required: false
        default: ''
        type: string
      dmm_sort_mode:
        description: 'ソートモード'
        required: false
        default: 'date'
        type: choice
        options:
          - date   # 新着順
          - rank   # 人気順
      max_articles:
        description: '1回の実行で下書き投稿する記事数の上限'
        required: false
        default: '5'
        type: string

jobs:
  post-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 取得開始番号の設定（空欄ならランダム）
        id: set_start_index
        run: |
          INPUT="${{ github.event.inputs.post_start_index }}"
          if [ -z "$INPUT" ]; then
            RAND=$(python3 -c "import random; print(random.randint(1, 480))")
            echo "start_index=$RAND" >> $GITHUB_OUTPUT
          else
            echo "start_index=$INPUT" >> $GITHUB_OUTPUT
          fi

      - name: はてなブログへ下書き投稿
        env:
          DMM_API_ID:        ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID:  ${{ secrets.DMM_AFFILIATE_ID }}
          HATENA_ID:         ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID:    ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY:    ${{ secrets.HATENA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_START_INDEX:  ${{ steps.set_start_index.outputs.start_index }}
          DMM_SORT_MODE:     ${{ github.event.inputs.dmm_sort_mode || 'date' }}
          MAX_ARTICLES:      ${{ github.event.inputs.max_articles || '5' }}
        run: python hatena_blog_poster.py

      - name: 除外ログをリポジトリにコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 除外ログ更新 ($(date +'%Y-%m-%d %H:%M:%S'))" && git push)
