name: FANZA同人 → はてなブログ 下書き生成（1時間ごと）

on:
  schedule:
    # 毎時0分に実行（UTC基準。1時間に1回）
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dmm_sort_mode:
        description: 'ソートモード'
        required: false
        default: 'rank'
        type: choice
        options:
          - rank   # 人気順
          - date   # 新着順
      max_articles:
        description: '1回の実行で下書き投稿する記事数の上限'
        required: false
        default: '5'
        type: string

concurrency:
  # 前回の実行が長引いていても、次のcronと重複起動しないようにする
  group: hatena-blog-post
  cancel-in-progress: false

jobs:
  post-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: はてなブログへ下書き投稿（rank上位・重複除外・5件になるまで検索）
        env:
          DMM_API_ID:        ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID:  ${{ secrets.DMM_AFFILIATE_ID }}
          HATENA_ID:         ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID:    ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY:    ${{ secrets.HATENA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DMM_SORT_MODE:     ${{ github.event.inputs.dmm_sort_mode || 'rank' }}
          MAX_ARTICLES:      ${{ github.event.inputs.max_articles || '5' }}
        run: python hatena_blog_poster.py

      - name: 投稿履歴・除外ログをリポジトリにコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 はてな自動投稿 履歴更新 ($(date +'%Y-%m-%d %H:%M:%S'))" && git push)
